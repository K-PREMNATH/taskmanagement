# =========================================================================
# ErconAdjustment Task Management - application.properties
# =========================================================================

spring.application.name=taskmanagement

# ---- Database (MSSQL) --------------------------------------------------
# Update host, port, database name, and credentials for your environment.
spring.datasource.url=jdbc:sqlserver://YOUR_DB_HOST:1433;databaseName=TaskManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=YOUR_DB_USER
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- JPA / Hibernate -----------------------------------------------------
# Tables already exist (created via the ErconAdjustment schema script) -
# use 'validate' in real environments so Hibernate never tries to alter them.
# 'none' is also fine once you trust the schema. Never use 'update'/'create' in prod.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.default_schema=ErconAdjustment
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Server ---------------------------------------------------------------
# Only used when running standalone (java -jar). When deployed as a WAR
# to JBoss, the context path is instead determined by the WAR/deployment name.
server.port=8080

# ---- Jackson --------------------------------------------------------------
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
